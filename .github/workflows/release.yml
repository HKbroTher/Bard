name: Release

# Builds installers for macOS, Windows and Linux.
# Run it from the Actions tab (optionally with a version such as v1.0.0 to publish a GitHub Release),
# or push a tag such as v1.0.0.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v1.0.0 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # Unsigned builds. Add CSC_LINK / CSC_KEY_PASSWORD (and APPLE_ID etc. for notarization) to sign.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: bard-${{ runner.os }}
          path: |
            release/*/*.dmg
            release/*/*.exe
            release/*/*.AppImage
            release/*/*.deb
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          tag_name: ${{ inputs.version || github.ref_name }}
          name: Bard ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
