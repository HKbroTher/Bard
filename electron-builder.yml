appId: app.bard.mail
productName: Bard
copyright: Copyright © 2026 Bard
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - package.json
asarUnpack: []
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  # Unsigned builds; set CSC_LINK / APPLE_ID secrets in CI to sign and notarize.
  identity: null
dmg:
  title: ${productName} ${version}
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Bard
linux:
  target: [AppImage, deb]
  category: Office
  maintainer: Bard
  syncDesktopName: true
  synopsis: Multilingual business email assistant
publish: null
